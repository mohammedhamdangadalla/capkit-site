<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — CapKit Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 70px 16px 30px;
  background: var(--obsidian);
}

.auth-card {
  width: 100%;
  max-width: 440px;
  background: var(--obsidian-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px 24px;
}

.auth-logo {
  text-align: center;
  margin-bottom: 26px;
}

.auth-logo h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.9rem;
  color: var(--text-primary);
  letter-spacing: 0.18em;
  margin-bottom: 6px;
}

.auth-logo p {
  color: var(--gold);
  font-size: 0.82rem;
  letter-spacing: 0.2em;
}

/* ═══ Smart Cards Stack ═══ */
.smart-cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.smart-card {
  background: var(--obsidian-3);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  transition: all 0.35s ease;
  position: relative;
}

.smart-card.locked {
  opacity: 0.55;
  cursor: not-allowed;
}

.smart-card.locked .smart-card-header {
  cursor: not-allowed;
}

.smart-card:not(.locked) .smart-card-header {
  cursor: pointer;
}

.smart-card:not(.locked):hover {
  border-color: var(--border-light);
  background: rgba(201, 169, 97, 0.03);
}

.smart-card.active {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(201, 169, 97, 0.08), rgba(201, 169, 97, 0.02));
  box-shadow: 0 8px 24px rgba(201, 169, 97, 0.12);
}

.smart-card.shake {
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.smart-card-header {
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.25s;
  user-select: none;
}

.smart-card.active .smart-card-header {
  border-bottom: 1px solid var(--border);
}

.smart-card-icon {
  font-size: 1.3rem;
  flex-shrink: 0;
}

.smart-card-title {
  flex: 1;
  color: var(--text-primary);
  font-family: 'Tajawal', sans-serif;
  font-size: 0.98rem;
  font-weight: 700;
}

.smart-card.active .smart-card-title {
  color: var(--gold);
}

.smart-card-state-icon {
  color: var(--text-muted);
  font-size: 0.9rem;
  transition: all 0.3s;
  flex-shrink: 0;
}

.smart-card.active .smart-card-state-icon {
  transform: rotate(180deg);
  color: var(--gold);
}

.smart-card.google-card .smart-card-state-icon {
  transform: none;
}

/* ═══ Card Body (Accordion) ═══ */
.smart-card-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease, padding 0.3s ease;
  padding: 0 18px;
}

.smart-card.active .smart-card-body {
  max-height: 1000px;
  padding: 18px;
}

/* ═══ Role Picker (4 Icons) ═══ */
.role-label {
  display: block;
  color: var(--text-secondary);
  font-size: 0.78rem;
  margin-bottom: 10px;
  font-weight: 500;
}

.role-picker {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 18px;
}

.role-option {
  background: var(--obsidian-2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 10px 4px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  position: relative;
}

.role-option:hover {
  border-color: rgba(201, 169, 97, 0.5);
}

.role-option.selected {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(201, 169, 97, 0.15), rgba(201, 169, 97, 0.03));
  box-shadow: 0 3px 10px rgba(201, 169, 97, 0.15);
}

.role-option.selected::after {
  content: '✓';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--gold);
  color: var(--obsidian);
  font-size: 0.55rem;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}

.role-icon {
  font-size: 1.3rem;
  line-height: 1;
}

.role-name {
  color: var(--text-secondary);
  font-size: 0.65rem;
  font-weight: 500;
  line-height: 1.2;
}

.role-option.selected .role-name {
  color: var(--gold);
  font-weight: 700;
}

/* ═══ Fields ═══ */
.auth-field {
  margin-bottom: 12px;
}

.auth-field label {
  display: block;
  color: var(--text-secondary);
  font-size: 0.76rem;
  margin-bottom: 6px;
  font-weight: 500;
}

.auth-field input {
  width: 100%;
  background: var(--obsidian-2);
  border: 1.5px solid var(--border);
  color: var(--text-primary);
  padding: 12px 14px;
  border-radius: 10px;
  font-family: 'Tajawal', sans-serif;
  font-size: 0.9rem;
  outline: none;
  transition: all 0.25s;
  box-sizing: border-box;
}

.auth-field input:focus {
  border-color: var(--gold);
  background: var(--obsidian-3);
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.1);
}

.auth-field input::placeholder {
  color: var(--text-muted);
  font-size: 0.85rem;
}

/* Password wrapper with eye */
.password-wrap {
  position: relative;
}

.password-wrap input {
  padding-left: 44px;
}

.pass-toggle {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 1rem;
  cursor: pointer;
  padding: 6px 8px;
  border-radius: 6px;
  transition: all 0.2s;
}

.pass-toggle:hover {
  color: var(--gold);
  background: rgba(201, 169, 97, 0.1);
}

/* Login actions row */
.login-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.login-actions .auth-btn {
  flex: 1;
  margin-top: 0;
}

.biometric-btn {
  width: 52px;
  background: var(--obsidian-2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--text-muted);
  font-size: 1.2rem;
  cursor: not-allowed;
  opacity: 0.5;
  transition: all 0.2s;
}

.forgot-link {
  display: block;
  text-align: center;
  margin-top: 12px;
  color: var(--text-muted);
  font-size: 0.78rem;
  text-decoration: none;
}

.forgot-link:hover {
  color: var(--gold);
}

/* ═══ Primary Button ═══ */
.auth-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: var(--obsidian);
  border: none;
  padding: 14px;
  border-radius: 11px;
  font-family: 'Tajawal', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 14px;
  letter-spacing: 0.3px;
  box-shadow: 0 4px 14px rgba(201, 169, 97, 0.2);
}

.auth-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(201, 169, 97, 0.35);
}

.auth-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* ═══ Google Card Special ═══ */
.smart-card.google-card .smart-card-header {
  padding: 16px 18px;
}

.smart-card.google-card .smart-card-title {
  text-align: right;
}

/* ═══ Message ═══ */
.auth-msg {
  padding: 12px 16px;
  border-radius: 11px;
  margin-bottom: 14px;
  font-size: 0.83rem;
  display: none;
  line-height: 1.5;
}

.auth-msg.error {
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5;
  display: block;
}

.auth-msg.success {
  background: rgba(34, 197, 94, 0.08);
  border: 1px solid rgba(34, 197, 94, 0.3);
  color: #86efac;
  display: block;
}

/* ═══ Terms Checkbox ═══ */
.terms-checkbox {
  padding: 14px 16px;
  background: var(--obsidian-3);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  transition: all 0.3s;
}

.terms-checkbox.checked {
  border-color: var(--gold);
  background: rgba(201, 169, 97, 0.06);
}

.terms-checkbox label {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 0.78rem;
  line-height: 1.65;
}

.terms-checkbox input[type="checkbox"] {
  width: 20px;
  height: 20px;
  margin-top: 2px;
  accent-color: var(--gold);
  cursor: pointer;
  flex-shrink: 0;
}

.terms-checkbox a {
  color: var(--gold);
  text-decoration: none;
  font-weight: 600;
}

.terms-checkbox a:hover {
  text-decoration: underline;
}

/* ═══ Back Button ═══ */
.auth-back {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(20, 20, 20, 0.9);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 1.05rem;
  transition: all 0.25s;
  z-index: 100;
}

.auth-back:hover {
  background: var(--gold);
  color: var(--obsidian);
  border-color: var(--gold);
  transform: rotate(90deg);
}

/* ═══ Mobile ═══ */
@media (max-width: 480px) {
  .auth-page {
    padding: 60px 12px 20px;
    align-items: flex-start;
  }

  .auth-card {
    padding: 24px 18px;
    border-radius: 18px;
  }

  .auth-logo h1 {
    font-size: 1.6rem;
  }

  .role-name {
    font-size: 0.6rem;
  }

  .role-icon {
    font-size: 1.15rem;
  }
}
</style>
<link rel="icon" href="/icon-192.png">
<link rel="shortcut icon" href="/icon-192.png">
</head>
<body>

<a href="/" class="auth-back">✕</a>

<main class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <h1>CAPKIT</h1>
      <p>كاب كيت كو</p>
    </div>

    <!-- Message Box -->
    <div id="authMsg" class="auth-msg"></div>

    <!-- ═══ Smart Cards Stack ═══ -->
    <div class="smart-cards">

      <!-- ═══ 1) Register Card ═══ -->
      <div class="smart-card locked" data-card="register">
        <div class="smart-card-header" onclick="toggleCard('register')">
          <span class="smart-card-icon">📝</span>
          <span class="smart-card-title">إنشاء حساب جديد</span>
          <span class="smart-card-state-icon">🔒</span>
        </div>
        <div class="smart-card-body">
          <label class="role-label">نوع الحساب</label>
          <div class="role-picker" id="rolePicker">
            <div class="role-option" data-role="vendor" onclick="selectRole(this, 'vendor')">
              <div class="role-icon">🛒</div>
              <div class="role-name">بائع</div>
            </div>
            <div class="role-option" data-role="service" onclick="selectRole(this, 'service')">
              <div class="role-icon">🔧</div>
              <div class="role-name">خدمة</div>
            </div>
            <div class="role-option" data-role="freelancer" onclick="selectRole(this, 'freelancer')">
              <div class="role-icon">🔨</div>
              <div class="role-name">صنايعي</div>
            </div>
            <div class="role-option" data-role="user" onclick="selectRole(this, 'user')">
              <div class="role-icon">👤</div>
              <div class="role-name">لاحقاً</div>
            </div>
          </div>

          <div class="auth-field">
            <label>الاسم الكامل</label>
            <input type="text" id="fullName" placeholder="اسمك الكامل أو اسم الورشة">
          </div>

          <div class="auth-field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="example@email.com">
          </div>

          <div class="auth-field">
            <label>رقم الواتساب</label>
            <input type="tel" id="phone" placeholder="+20 1XX XXX XXXX">
          </div>

          <div class="auth-field">
            <label>كلمة المرور</label>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="8 أحرف على الأقل">
              <button type="button" class="pass-toggle" onclick="togglePassword('password')">👁️</button>
            </div>
          </div>

          <button class="auth-btn" id="registerBtn">إنشاء الحساب</button>
        </div>
      </div>

      <!-- ═══ 2) Login Card ═══ -->
      <div class="smart-card locked" data-card="login">
        <div class="smart-card-header" onclick="toggleCard('login')">
          <span class="smart-card-icon">🔐</span>
          <span class="smart-card-title">تسجيل الدخول</span>
          <span class="smart-card-state-icon">🔒</span>
        </div>
        <div class="smart-card-body">
          <div class="auth-field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="loginEmail" placeholder="example@email.com">
          </div>

          <div class="auth-field">
            <label>كلمة المرور</label>
            <div class="password-wrap">
              <input type="password" id="loginPassword" placeholder="كلمة المرور">
              <button type="button" class="pass-toggle" onclick="togglePassword('loginPassword')">👁️</button>
            </div>
          </div>

          <div class="login-actions">
            <button class="auth-btn" id="loginBtn">🔐 دخول</button>
            <button class="biometric-btn" id="biometricBtn" type="button" title="قريباً">👆</button>
          </div>

          <a href="#" class="forgot-link" onclick="alert('سيتم إضافة استعادة كلمة المرور قريباً'); return false;">
            نسيت كلمة المرور؟
          </a>
        </div>
      </div>

      <!-- ═══ 3) Google Card ═══ -->
      <div class="smart-card google-card locked" data-card="google">
        <div class="smart-card-header" onclick="handleGoogleClick()">
          <svg width="20" height="20" viewBox="0 0 48 48" style="flex-shrink: 0;">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span class="smart-card-title">الدخول بحساب Google</span>
          <span class="smart-card-state-icon">🔒</span>
        </div>
      </div>

    </div>

    <!-- ═══ Terms Checkbox (المفتاح) ═══ -->
    <div class="terms-checkbox" id="termsBox">
      <label>
        <input type="checkbox" id="agreeTerms" onchange="handleTermsChange(this)">
        <span>
          أوافق على <a href="manifesto.html" target="_blank">الميثاق</a>،
          <a href="terms.html" target="_blank">الشروط والأحكام</a>،
          و<a href="privacy.html" target="_blank">سياسة الخصوصية</a>
        </span>
      </label>
    </div>

  </div>
</main>

<!-- ═══ Supabase ═══ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>

</body>
</html>
