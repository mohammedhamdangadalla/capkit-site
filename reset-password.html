<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة المرور — CapKit Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.rp-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 70px 16px 30px;
  background: var(--obsidian);
}
.rp-card {
  width: 100%;
  max-width: 420px;
  background: var(--obsidian-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px 24px;
}
.rp-logo {
  text-align: center;
  margin-bottom: 24px;
}
.rp-logo h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.8rem;
  color: var(--text-primary);
  letter-spacing: 0.15em;
  margin-bottom: 6px;
}
.rp-logo p {
  color: var(--gold);
  font-size: 0.8rem;
  letter-spacing: 0.2em;
}
.rp-header {
  text-align: center;
  margin-bottom: 24px;
}
.rp-header h2 {
  font-family: 'Amiri', serif;
  font-size: 1.3rem;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.rp-header p {
  color: var(--text-muted);
  font-size: 0.85rem;
  line-height: 1.7;
}
.rp-field {
  margin-bottom: 14px;
}
.rp-field label {
  display: block;
  color: var(--text-secondary);
  font-size: 0.78rem;
  margin-bottom: 6px;
  font-weight: 500;
}
.rp-field input {
  width: 100%;
  background: var(--obsidian-3);
  border: 1.5px solid var(--border);
  color: var(--text-primary);
  padding: 12px 14px;
  border-radius: 10px;
  font-family: 'Tajawal', sans-serif;
  font-size: 0.92rem;
  outline: none;
  transition: all 0.25s;
  box-sizing: border-box;
}
.rp-field input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.1);
}
.rp-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: var(--obsidian);
  border: none;
  padding: 14px;
  border-radius: 11px;
  font-family: 'Tajawal', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 8px;
  box-shadow: 0 4px 14px rgba(201, 169, 97, 0.2);
}
.rp-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(201, 169, 97, 0.35);
}
.rp-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.rp-msg {
  padding: 12px 16px;
  border-radius: 11px;
  margin-bottom: 14px;
  font-size: 0.85rem;
  display: none;
  line-height: 1.6;
}
.rp-msg.error {
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5;
  display: block;
}
.rp-msg.success {
  background: rgba(34, 197, 94, 0.08);
  border: 1px solid rgba(34, 197, 94, 0.3);
  color: #86efac;
  display: block;
}
.rp-back {
  display: block;
  text-align: center;
  margin-top: 18px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.82rem;
}
.rp-back:hover { color: var(--gold); }
</style>
<link rel="icon" href="/icon-192.png">
</head>
<body>

<main class="rp-page">
  <div class="rp-card">
    <div class="rp-logo">
      <h1>CAPKIT</h1>
      <p>كاب كيت كو</p>
    </div>

    <div class="rp-header">
      <h2 id="rpTitle">نسيت كلمة المرور؟</h2>
      <p id="rpDesc">أدخل بريدك الإلكتروني وسنرسل لك رابط لإعادة التعيين</p>
    </div>

    <div id="rpMsg" class="rp-msg"></div>

    <!-- Request Form -->
    <div id="requestForm">
      <div class="rp-field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="rpEmail" placeholder="example@email.com">
      </div>
      <button class="rp-btn" id="rpSendBtn">إرسال رابط الإعادة</button>
    </div>

    <!-- Update Form (hidden by default) -->
    <div id="updateForm" style="display: none;">
      <div class="rp-field">
        <label>كلمة المرور الجديدة</label>
        <input type="password" id="rpNewPass" placeholder="8 أحرف على الأقل">
      </div>
      <div class="rp-field">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="rpConfirmPass" placeholder="أعد كتابة كلمة المرور">
      </div>
      <button class="rp-btn" id="rpUpdateBtn">حفظ كلمة المرور الجديدة</button>
    </div>

    <a href="auth.html" class="rp-back">← العودة لتسجيل الدخول</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="reset-password.js"></script>

</body>
</html>
