<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف الشخصي — CapKit Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.user-page {
  min-height: 100vh;
  padding: 80px 16px 40px;
  background: var(--obsidian);
}

.user-container {
  max-width: 1100px;
  margin: 0 auto;
}

.loading-state {
  text-align: center;
  padding: 100px 20px;
  color: var(--gold);
}

.not-found {
  text-align: center;
  padding: 100px 20px;
}

/* ═══ Header Card ═══ */
.user-header {
  background: linear-gradient(135deg, rgba(201, 169, 97, 0.12), rgba(201, 169, 97, 0.03));
  border: 1px solid var(--border-light);
  border-radius: 20px;
  padding: 28px 24px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.user-header::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(201, 169, 97, 0.15), transparent 70%);
  pointer-events: none;
}

.user-header-top {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  margin-bottom: 20px;
  position: relative;
  z-index: 2;
  flex-wrap: wrap;
}

.user-avatar-large {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
  flex-shrink: 0;
  box-shadow: 0 10px 30px rgba(201, 169, 97, 0.3);
}

.user-header-info {
  flex: 1;
  min-width: 200px;
}

.user-name-large {
  font-family: 'Amiri', serif;
  font-size: 1.7rem;
  color: var(--text-primary);
  margin-bottom: 6px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.verified-badge {
  font-size: 0.9rem;
  color: #22c55e;
}

.user-role-line {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-secondary);
  font-size: 0.88rem;
  margin-bottom: 6px;
  flex-wrap: wrap;
}

.user-role-line .dot {
  color: var(--text-muted);
}

.user-meta-line {
  color: var(--text-muted);
  font-size: 0.8rem;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* ═══ Stats ═══ */
.user-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  position: relative;
  z-index: 2;
}

.user-stat {
  text-align: center;
}

.user-stat-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
  margin-bottom: 4px;
}

.user-stat-label {
  color: var(--text-muted);
  font-size: 0.72rem;
}

/* ═══ Action Buttons ═══ */
.user-actions {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.btn-user-action {
  flex: 1;
  min-width: 140px;
  padding: 14px 20px;
  border-radius: 12px;
  font-family: 'Tajawal', sans-serif;
  font-weight: 700;
  font-size: 0.92rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.3s;
  border: none;
  text-decoration: none;
}

.btn-user-action.primary {
  background: #25d366;
  color: white;
}

.btn-user-action.primary:hover {
  background: #1ebe5a;
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(37, 211, 102, 0.25);
}

.btn-user-action.follow {
  background: var(--gold);
  color: var(--obsidian);
}

.btn-user-action.follow:hover {
  background: var(--gold-light);
  transform: translateY(-2px);
}

.btn-user-action.follow.following {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
}

.btn-user-action.secondary {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-light);
  flex: 0 1 auto;
  min-width: auto;
  padding: 14px 18px;
}

.btn-user-action.secondary:hover {
  border-color: var(--gold);
  color: var(--gold);
}

/* ═══ Sections ═══ */
.user-section {
  margin-bottom: 24px;
}

.user-section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.user-section-title {
  font-family: 'Amiri', serif;
  font-size: 1.3rem;
  color: var(--text-primary);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-section-title::before {
  content: '';
  width: 3px;
  height: 20px;
  background: var(--gold);
  border-radius: 2px;
}

.user-section-count {
  color: var(--gold);
  font-size: 0.85rem;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 700;
}

.user-bio {
  background: var(--obsidian-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  color: var(--text-secondary);
  line-height: 1.9;
  font-size: 0.95rem;
}

.user-bio-empty {
  color: var(--text-muted);
  font-style: italic;
  text-align: center;
}

/* ═══ Products Grid ═══ */
.user-products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
}

.user-empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  background: var(--obsidian-2);
  border: 1px dashed var(--border);
  border-radius: 12px;
}

.user-empty-icon {
  font-size: 2.5rem;
  opacity: 0.4;
  margin-bottom: 10px;
}

/* ═══ Ratings ═══ */
.ratings-summary {
  background: var(--obsidian-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.rating-big {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3rem;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
}

.rating-stars-big {
  color: var(--gold);
  font-size: 1.3rem;
  letter-spacing: 2px;
}

.rating-count {
  color: var(--text-muted);
  font-size: 0.85rem;
  margin-top: 4px;
}

.ratings-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.rating-card {
  background: var(--obsidian-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
}

.rating-card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.rating-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--obsidian-3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  flex-shrink: 0;
}

.rating-info {
  flex: 1;
  min-width: 0;
}

.rating-info h4 {
  color: var(--text-primary);
  font-size: 0.9rem;
  font-weight: 700;
  margin-bottom: 2px;
}

.rating-info .meta {
  color: var(--text-muted);
  font-size: 0.72rem;
  display: flex;
  align-items: center;
  gap: 6px;
}

.rating-stars-small {
  color: var(--gold);
  font-size: 0.9rem;
  letter-spacing: 1px;
  flex-shrink: 0;
}

.rating-text {
  color: var(--text-secondary);
  font-size: 0.88rem;
  line-height: 1.7;
}

/* ═══ Mobile ═══ */
@media (max-width: 700px) {
  .user-page {
    padding: 70px 12px 30px;
  }
  
  .user-header {
    padding: 22px 18px;
  }
  
  .user-avatar-large {
    width: 70px;
    height: 70px;
    font-size: 1.8rem;
  }
  
  .user-name-large {
    font-size: 1.3rem;
  }
  
  .user-stats {
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  
  .user-stat-value {
    font-size: 1.3rem;
  }
  
  .user-products-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  
  .ratings-summary {
    padding: 16px;
  }
  
  .rating-big {
    font-size: 2.2rem;
  }
}
</style>
</head>
<body>

<main class="user-page">
  <div class="user-container">
    
    <!-- Loading -->
    <div id="loadingState" class="loading-state">
      ⏳ جارٍ التحميل...
    </div>

    <!-- Not Found -->
    <div id="notFoundState" class="not-found" style="display: none;">
      <div class="not-found-icon" style="font-size: 4rem; opacity: 0.4;">🔍</div>
      <h2 style="font-family: 'Amiri', serif; color: var(--text-primary); margin: 20px 0 10px;">المستخدم غير موجود</h2>
      <p style="color: var(--text-secondary); margin-bottom: 20px;">ربما تم حذفه أو الرابط غير صحيح</p>
      <a href="/" class="btn-user-action primary" style="max-width: 250px; margin: 0 auto;">← العودة للرئيسية</a>
    </div>

    <!-- User Content -->
    <div id="userContent" style="display: none;">
      
      <!-- Header -->
      <div class="user-header">
        <div class="user-header-top">
          <div class="user-avatar-large" id="userAvatar">👤</div>
          <div class="user-header-info">
            <div class="user-name-large" id="userName">
              —
              <span class="verified-badge" id="verifiedBadge" style="display: none;">✓ موثّق</span>
            </div>
            <div class="user-role-line" id="userRole">
              <span>—</span>
            </div>
            <div class="user-meta-line" id="userMeta">—</div>
          </div>
        </div>
        <div class="user-stats">
          <div class="user-stat">
            <div class="user-stat-value" id="statProducts">0</div>
            <div class="user-stat-label">منتج</div>
          </div>
          <div class="user-stat">
            <div class="user-stat-value" id="statServices">0</div>
            <div class="user-stat-label">خدمة</div>
          </div>
          <div class="user-stat">
            <div class="user-stat-value" id="statFollowers">0</div>
            <div class="user-stat-label">متابع</div>
          </div>
          <div class="user-stat">
            <div class="user-stat-value" id="statRating">—</div>
            <div class="user-stat-label">تقييم</div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="user-actions" id="userActions">
        <a href="#" class="btn-user-action primary" id="whatsappContact" target="_blank">
          <span>💬</span>
          <span>تواصل واتساب</span>
        </a>
        <button class="btn-user-action follow" id="followBtn" onclick="toggleFollow()">
          <span>♡</span>
          <span>متابعة</span>
        </button>
        <button class="btn-user-action secondary" onclick="shareProfile()">
          <span>🔗</span>
        </button>
      </div>

      <!-- Bio -->
      <div class="user-section" id="bioSection">
        <div class="user-section-header">
          <h2 class="user-section-title">نبذة</h2>
        </div>
        <div class="user-bio" id="userBio">—</div>
      </div>

      <!-- Products -->
      <div class="user-section" id="productsSection">
        <div class="user-section-header">
          <h2 class="user-section-title">المنتجات</h2>
          <span class="user-section-count" id="productsCount">0</span>
        </div>
        <div id="productsContainer">
          <div class="user-empty-state">
            <div class="user-empty-icon">📦</div>
            <div>لا توجد منتجات بعد</div>
          </div>
        </div>
      </div>

      <!-- Services -->
      <div class="user-section" id="servicesSection" style="display: none;">
        <div class="user-section-header">
          <h2 class="user-section-title">الخدمات</h2>
          <span class="user-section-count" id="servicesCount">0</span>
        </div>
        <div id="servicesContainer"></div>
      </div>

      <!-- Ratings -->
      <div class="user-section" id="ratingsSection">
        <div class="user-section-header">
          <h2 class="user-section-title">التقييمات</h2>
          <span class="user-section-count" id="ratingsCount">0</span>
        </div>
        <div id="ratingsContainer">
          <div class="user-empty-state">
            <div class="user-empty-icon">⭐</div>
            <div>لا توجد تقييمات بعد</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</main>

<!-- ═══ Supabase ═══ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="user.js"></script>

</body>
</html>
