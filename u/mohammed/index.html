    background: linear-gradient(160deg, var(--surface-2), var(--surface));
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    text-align: center;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: -40% -20% auto;
    height: 260px;
    background: radial-gradient(circle at 50% 0, var(--gold-soft), transparent 70%);
    pointer-events: none;
  }

  .avatar {

    display: block;

    font-weight: 500;
    color: var(--gold);
    letter-spacing: 0.4px;

    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .verified {
    color: var(--gold);
    font-weight: 700;
  }

  .bio {
    margin: 16px auto 0;
    max-width: 34ch;
    font-size: 0.92rem;
    line-height: 1.85;
    color: #cfcbc4;
  }

  .socials {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 18px;
  }

  .socials a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text);
    font-size: 0.8rem;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s, transform 0.2s;
  }

  .socials a:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }

  .actions { display: grid; gap: 10px; margin-top: 22px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 18px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
  }

  .btn:active { transform: scale(0.985); }

  .btn-primary { background: var(--whatsapp); color: #06301a; }
  .btn-gold { background: var(--gold); color: #151006; }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }

  .btn[hidden] { display: none; }

  .brand {
    margin-top: 18px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .brand a { color: var(--gold); text-decoration: none; font-weight: 700; }

  .state {
    display: none;
    text-align: center;
    padding: 70px 20px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--surface);
  }

  .state.show { display: block; }

  .state-icon { font-size: 2.6rem; opacity: 0.5; }
  .state h2 { font-family: 'Amiri', serif; margin: 14px 0 8px; font-size: 1.3rem; }
  .state p { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }

  .loading { display: grid; place-items: center; padding: 90px 0; color: var(--gold); }
  .loading[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
