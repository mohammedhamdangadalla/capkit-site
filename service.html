<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.service-page { min-height: 100vh; padding: 80px 16px 40px; background: var(--obsidian); }
.service-container { max-width: 1100px; margin: 0 auto; }
.loading-state { text-align: center; padding: 100px 20px; color: var(--gold); font-size: 1.1rem; }
.not-found { text-align: center; padding: 100px 20px; }
.not-found-icon { font-size: 4rem; opacity: 0.4; margin-bottom: 20px; }
.not-found h2 { font-family: 'Amiri', serif; font-size: 1.6rem; color: var(--text-primary); margin-bottom: 12px; }
.not-found p { color: var(--text-secondary); margin-bottom: 24px; }
.service-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px; }
.service-visual { background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(59, 130, 246, 0.02)); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 20px; padding: 60px 30px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; min-height: 400px; }
.service-visual::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; height: 400px; background: radial-gradient(circle, rgba(59, 130, 246, 0.2), transparent 70%); pointer-events: none; }
.service-icon-big { font-size: 8rem; position: relative; z-index: 2; filter: drop-shadow(0 20px 40px rgba(59, 130, 246, 0.4)); }
.service-type-badge { position: absolute; top: 20px; right: 20px; background: #3b82f6; color: white; padding: 6px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; z-index: 3; }
.service-info-main { display: flex; flex-direction: column; gap: 20px; }
.service-badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge-tag { padding: 5px 12px; border-radius: 50px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; }
.badge-tag.service-type { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
.badge-tag.status { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
.badge-tag.negotiable { background: rgba(201, 169, 97, 0.15); color: var(--gold); border: 1px solid var(--border-light); }
.service-title-main { font-family: 'Amiri', serif; font-size: clamp(1.6rem, 3.5vw, 2.4rem); color: var(--text-primary); line-height: 1.3; font-weight: 700; }
.service-price-main { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 700; color: var(--gold); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.service-price-main .from { font-family: 'Tajawal', sans-serif; font-size: 0.85rem; color: var(--text-muted); font-weight: 400; }
.service-price-main small { font-size: 1rem; color: var(--text-muted); font-family: 'Tajawal', sans-serif; }
.service-description { color: var(--text-secondary); font-size: 1rem; line-height: 1.9; padding: 20px; background: var(--obsidian-2); border: 1px solid var(--border); border-radius: 12px; }
.seller-box { background: var(--obsidian-2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.3s; }
.seller-box:hover { border-color: var(--gold); }
.seller-avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-light)); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
.seller-info h4 { font-family: 'Amiri', serif; font-size: 1.05rem; color: var(--text-primary); margin-bottom: 4px; font-weight: 700; }
.seller-info h4 a { color: inherit; text-decoration: none; }
.seller-info p { color: var(--text-muted); font-size: 0.82rem; }
.service-actions-main { display: flex; gap: 10px; flex-direction: column; }
.btn-whatsapp { background: #25d366; color: white; padding: 16px 24px; border-radius: 12px; text-decoration: none; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; border: none; cursor: pointer; }
.btn-whatsapp:hover { background: #1ebe5a; transform: translateY(-2px); box-shadow: 0 10px 25px rgba(37, 211, 102, 0.25); }
.btn-secondary-action { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-light); padding: 14px 24px; border-radius: 12px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: 500; font-size: 0.92rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; }
.btn-secondary-action:hover { border-color: var(--gold); color: var(--gold); }
@media (max-width: 800px) {
  .service-page { padding: 70px 12px 30px; }
  .service-layout { grid-template-columns: 1fr; gap: 24px; }
  .service-visual { min-height: 250px; padding: 40px 20px; }
  .service-icon-big { font-size: 5rem; }
  .service-price-main { font-size: 1.6rem; }
}
</style>
  <link rel="icon" href="/icon-192.png">
<link rel="shortcut icon" href="/icon-192.png">
</head>
<body>

<main class="service-page">
  <div class="service-container">
    
    <!-- Loading -->
    <div id="loadingState" class="loading-state">
      ⏳ جارٍ التحميل...
    </div>

    <!-- Not Found -->
    <div id="notFoundState" class="not-found" style="display: none;">
      <div class="not-found-icon">🔍</div>
      <h2>الخدمة غير موجودة</h2>
      <p>ربما تم حذفها أو الرابط غير صحيح</p>
      <a href="/" class="btn-secondary-action" style="max-width: 250px; margin: 0 auto;">← العودة للرئيسية</a>
    </div>

    <!-- Service Content -->
    <div id="serviceContent" style="display: none;">
      <div class="service-layout">
        
        <!-- Visual -->
        <div class="service-visual">
          <span class="service-type-badge" id="serviceTypeBadge">خدمة</span>
          <div class="service-icon-big" id="serviceIcon">🔧</div>
        </div>

        <!-- Info -->
        <div class="service-info-main">
          
          <div class="service-badges" id="serviceBadges"></div>

          <h1 class="service-title-main" id="serviceTitle">—</h1>

          <!-- ✅ زر الأدمن لتعليق الخدمة (مخفي افتراضياً) -->
          <div id="adminSuspendContainer" style="display: none; margin: 5px 0;">
              <button id="btnSuspendService" style="background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid #ef4444; padding: 10px 20px; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s;">
                  ⛔ تعليق هذه الخدمة (للمشرفين)
              </button>
          </div>

          <div class="service-price-main" id="servicePrice">
            <span>—</span>
          </div>

          <div class="service-description" id="serviceDescription">
            —
          </div>

          <div class="seller-box" id="sellerBox" onclick="goToSeller()">
            <div class="seller-avatar" id="sellerAvatar">👤</div>
            <div class="seller-info">
              <h4>—</h4>
              <p>—</p>
            </div>
          </div>

          <div class="service-actions-main">
            <!-- ✅ زر الطلب الجديد (مضاف هنا) -->
            <button class="btn-whatsapp" id="orderServiceBtn" style="background: var(--gold); color: var(--obsidian);" onclick="triggerCreateOrder('service')">
              <span>🛠️</span>
              <span>اطلب الخدمة الآن (عبر المنصة)</span>
            </button>

            <a href="#" class="btn-whatsapp" id="whatsappBtn" target="_blank">
              <span>💬</span>
              <span>اطلب الخدمة عبر واتساب</span>
            </a>
            
            <div style="display: flex; gap: 10px;">
              <div id="likeContainer" style="flex: 1;"></div>
              <button class="btn-secondary-action" id="shareBtn" style="flex: 1;">
                <span>🔗</span>
                <span>مشاركة</span>
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- ═══ Ratings Section ═══ -->
    <section class="comments-section" id="ratingsSection">
      <div class="comments-header">
        <h3 class="comments-title">⭐ التقييمات</h3>
      </div>
      <div id="ratingSummary"></div>
      <div id="ratingFormContainer"></div>
      <div id="ratingsList" style="margin-top: 20px;"></div>
    </section>

    <!-- ═══ Comments Section ═══ -->
    <section class="comments-section" id="commentsSection">
      <div class="comments-header">
        <h3 class="comments-title">
          💬 التعليقات
          <span class="count">(<span id="commentsCount">0</span>)</span>
        </h3>
      </div>
      <div id="commentFormContainer"></div>
      <div class="comments-list" id="commentsList">
        <div class="comments-loading">⏳ جارٍ التحميل...</div>
      </div>
    </section>

  </div>
</main>

<!-- ═══ Supabase ═══ -->

<script src="footer.js"></script>

<!-- ═══ كود نظام الطلبات (مضاف هنا ليعمل مباشرة) ═══ -->
<script>
window.triggerCreateOrder = async function(type) {
  if (!window.supabaseClient) return alert('يجب تسجيل الدخول أولاً');

  // 1. القراءة الفورية من ذاكرة المتصفح
  let { data: { session } } = await window.supabaseClient.auth.getSession();
  let user = session?.user;

  // 2. إذا لم يجدها، ينتظر ثانية ويحاول مرة أخرى (للشبكات الضعيفة)
  if (!user) {
    await new Promise(r => setTimeout(r, 1000));
    const retry = await window.supabaseClient.auth.getSession();
    user = retry.data.session?.user;
  }

  // 3. الطرد فقط إذا كان زائراً حقيقياً (لم يسجل دخول من الأصل)
  if (!user) {
    alert('⚠️ يرجى تسجيل الدخول لإتمام الطلب.');
    window.location.href = 'auth.html'; 
    return;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const serviceId = urlParams.get('id') || urlParams.get('slug'); 
  
  if (!serviceId) return alert('خطأ: لم يتم العثور على معرف الخدمة في الرابط.');

  try {
    // جلب بيانات الخدمة من قاعدة البيانات مباشرة
    const { data: service, error } = await window.supabaseClient
      .from('services')
      .select('*, workshops(owner_id), freelancers(user_id)')
      .or(`id.eq.${serviceId},slug.eq.${serviceId}`)
      .single();

    if (error || !service) throw new Error('لم يتم العثور على الخدمة');

    // تحديد مقدم الخدمة
    let vendorId = service.freelancers?.user_id;
    if (service.workshop_id && service.workshops?.owner_id) {
      vendorId = service.workshops.owner_id;
    }

    if (!vendorId) throw new Error('تعذر تحديد مقدم الخدمة');
    if (user.id === vendorId) return alert('لا يمكنك طلب خدمتك الخاصة!');

    const btn = document.getElementById('orderServiceBtn');
    btn.innerHTML = '⏳ جارٍ التحقق...';
    btn.disabled = true;

    const price = service.price_start || 0;

    // ✅ فحص وجود طلب مفتوح مسبقاً لنفس الخدمة لمنع التكرار
    const { data: existingOrders } = await window.supabaseClient
      .from('orders')
      .select('id, order_items!inner(service_id)')
      .eq('buyer_id', user.id)
      .eq('vendor_id', vendorId)
      .in('status', ['pending', 'accepted', 'cart'])
      .eq('order_items.service_id', service.id);

    if (existingOrders && existingOrders.length > 0) {
      alert('⚠️ لديك طلب مفتوح بالفعل لهذه الخدمة. سيتم تحويلك للمحادثة.');
      window.location.href = `dashboard.html?tab=orders&order=${existingOrders[0].id}`;
      return;
    }

    btn.innerHTML = '⏳ جارٍ إنشاء الطلب...';

    // 1. إنشاء الطلب
    const { data: order, error: orderErr } = await window.supabaseClient
      .from('orders')
      .insert({
        buyer_id: user.id,
        vendor_id: vendorId,
        workshop_id: service.workshop_id || null,
        status: 'pending',
        subtotal: price
      })
      .select().single();

    if (orderErr) throw new Error('فشل إنشاء الطلب: ' + orderErr.message);

    // 2. إضافة الخدمة للطلب
    const imageUrl = service.images && service.images.length > 0 ? service.images[0] : null;
    const { error: itemErr } = await window.supabaseClient
      .from('order_items')
      .insert({
        order_id: order.id,
        item_type: 'service',
        service_id: service.id,
        title_snapshot: service.title,
        image_snapshot: imageUrl,
        unit_price: price,
        quantity: 1
      });

    if (itemErr) throw new Error('فشل إضافة الخدمة للطلب: ' + itemErr.message);

    // 3. التحويل للوحة التحكم وفتح المحادثة
    window.location.href = `dashboard.html?tab=orders&order=${order.id}`;

  } catch (err) {
    console.error(err);
    alert('❌ ' + err.message);
    const btn = document.getElementById('orderServiceBtn');
    if(btn) { btn.innerHTML = '<span>🛠️</span><span>اطلب الخدمة الآن (عبر المنصة)</span>'; btn.disabled = false; }
  }
};
</script>

</body>
